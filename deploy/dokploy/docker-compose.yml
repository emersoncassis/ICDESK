# Servidor ICDESK (ID/rendezvous + relay) para o Dokploy.
# Variável obrigatória no Dokploy (aba Environment): ICDESK_DOMAIN=desk.seudominio.com
services:
  hbbs:
    container_name: icdesk-hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    environment:
      - RELAY=${ICDESK_DOMAIN}:21117
      - ENCRYPTED_ONLY=1
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    volumes:
      - icdesk-data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: icdesk-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    ports:
      - "21117:21117"
    volumes:
      - icdesk-data:/root
    restart: unless-stopped

volumes:
  icdesk-data:
