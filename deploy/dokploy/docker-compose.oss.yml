# Servidor ICDESK (edição OSS): ID/rendezvous + relay, para o Dokploy.
#
# Na aba Environment do Dokploy defina:
#   ICDESK_DOMAIN=desk.seudominio.com
#
# Usa "ports:" (e não network_mode host) porque o Dokploy injeta uma rede própria
# no serviço e o Docker não aceita as duas coisas juntas.
# Libere no firewall da VPS: 21115/tcp  21116/tcp  21116/udp  21117/tcp
services:
  hbbs:
    container_name: icdesk-hbbs
    image: rustdesk/rustdesk-server:latest
    # -r: endereço do relay que os apps recebem | -k _: só aceita apps com a chave do servidor
    command: hbbs -r ${ICDESK_DOMAIN:?defina ICDESK_DOMAIN}:21117 -k _
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    volumes:
      - icdesk-data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: icdesk-hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    ports:
      - "21117:21117"
    volumes:
      - icdesk-data:/root
    restart: unless-stopped

volumes:
  icdesk-data:
